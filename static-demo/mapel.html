<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mapel - Profil Jurusan RPL</title>

  <link rel="icon" type="image/jpeg" href="assets/logo/logoril3.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <div class="container mt-4 flex-grow-1">
    <div class="layout-golden">
      <div class="left-col">
        <div class="d-flex justify-content-between mb-3 align-items-center">
          <h4>Data Mapel</h4>
          <button id="btnToggleAddMapel" class="btn btn-success d-none" data-bs-toggle="collapse" data-bs-target="#formAdd">
            Tambah Mapel
          </button>
        </div>

        <div id="formAdd" class="collapse mb-3 card p-3 d-none">
          <form id="formTambahMapel" novalidate>
            <div class="row g-2 align-items-center">
              <div class="col-md-6">
                <input id="add-nama-mapel" name="nama_mapel" class="form-control" placeholder="Nama Mapel" required>
              </div>
              <div class="col-md-4">
                <select id="add-kategori" name="kategori" class="form-select" required>
                  <option value="">-- Pilih Kategori --</option>
                  <option value="Produktif">Produktif</option>
                  <option value="Umum">Umum</option>
                </select>
              </div>
              <div class="col-md-2 text-end">
                <button type="submit" class="btn btn-primary w-100">Simpan</button>
              </div>
            </div>
          </form>
        </div>

        <div class="d-flex justify-content-between mb-2 align-items-center flex-wrap gap-2">
          <div class="input-group w-50" style="min-width:220px;">
            <span class="input-group-text"><i class="fa fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Cari mapel...">
          </div>
          <div class="d-flex gap-2">
            <button type="button" id="btnExportCsv" class="btn btn-outline-primary btn-sm">Export CSV</button>
            <button type="button" id="btnExportPdfAll" class="btn btn-outline-danger btn-sm">Export PDF</button>
          </div>
        </div>

        <div id="mapelContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mb-5"></div>
      </div>

      <aside class="sidebar">
        <div class="stat-card">
          <h6>Total Mapel</h6>
          <div class="stat-value" id="stat-total-mapel">0</div>
        </div>
        <div class="stat-card">
          <h6>Kategori</h6>
          <div id="stat-kategori-list"></div>
        </div>
        <div class="stat-card">
          <h6>Terakhir Ditambahkan</h6>
          <div class="recent-list" id="recent-mapel-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Detail / Edit Modal -->
  <div class="modal fade" id="detailModalMapel" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="padding-left: 40px;" id="detailModalMapelLabel">
            Detail Mapel: <span id="modal-mapel-nama"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="modal-mapel-view">
            <p><strong>Nama Mapel:</strong> <span id="detail-nama"></span></p>
            <p><strong>Kategori:</strong> <span id="detail-kategori"></span></p>
            <p><strong>Guru Pengampu:</strong></p>
            <div style="padding-left: 40px;" id="detail-guru-list" class="wrap-text"></div>
          </div>

          <div id="modal-mapel-edit" style="display:none;">
            <form id="mapelEditForm" novalidate>
              <input type="hidden" id="edit-id-mapel">
              <div class="row g-2">
                <div class="col-md-8 mb-2">
                  <label class="form-label small text-muted">Nama Mapel</label>
                  <input type="text" id="edit-nama-mapel" class="form-control" required>
                </div>
                <div class="col-md-4 mb-2">
                  <label class="form-label small text-muted">Kategori</label>
                  <select id="edit-kategori" class="form-select" required>
                    <option value="Produktif">Produktif</option>
                    <option value="Umum">Umum</option>
                  </select>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="modal-footer d-flex flex-column align-items-center pt-0">
          <div id="view-buttons" class="w-100 d-flex justify-content-center gap-2 mb-3">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            <button type="button" id="btnModalEdit" class="btn btn-primary d-none">Edit</button>
            <button type="button" id="btnModalDelete" class="btn btn-danger d-none">Hapus</button>
          </div>

          <div id="edit-buttons" class="w-100 d-flex justify-content-center gap-2 mb-3" style="display: none !important;">
            <button type="button" id="btnModalSave" class="btn btn-primary">Simpan</button>
            <button type="button" id="btnModalCancelEdit" class="btn btn-secondary">Batal</button>
          </div>

          <div id="export-wrap" class="mt-1">
            <button type="button" id="btn-export-mapel-pdf" class="btn btn-sm btn-outline-danger">Export PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="assets/js/pages/mapel.js"></script>
</body>
</html>
