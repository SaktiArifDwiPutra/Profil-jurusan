<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Nilai Siswa - Profil Jurusan RPL</title>

  <link rel="icon" type="image/jpeg" href="assets/logo/logoril3.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <div class="container mt-4 flex-grow-1">
    <div id="nilai-detail-root"></div>
  </div>

  <!-- Modal Input Nilai (Ganjil & Genap) -->
  <div class="modal fade" id="modalInputNilai" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Kelola Nilai: <span id="modalMapelName" class="fw-bold"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-tabs nav-fill mb-3" id="semesterTab" role="tablist">
            <li class="nav-item">
              <button class="nav-link active" id="ganjil-tab" data-bs-toggle="tab" data-bs-target="#tabGanjil" type="button">
                Semester Ganjil
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="genap-tab" data-bs-toggle="tab" data-bs-target="#tabGenap" type="button">
                Semester Genap
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="tabGanjil">
              <form id="formNilaiGanjil" novalidate>
                <input type="hidden" id="inputAmpuGanjil">
                <div class="mb-2">
                  <label class="form-label small text-muted">Nilai Tugas</label>
                  <input type="number" step="0.01" min="0" max="100" id="tugasGanjil" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small text-muted">Nilai UTS</label>
                  <input type="number" step="0.01" min="0" max="100" id="utsGanjil" class="form-control" required>
                </div>
                <div class="d-flex justify-content-between">
                  <div id="btnDeleteGanjilContainer"></div>
                  <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Simpan Ganjil</button>
                </div>
              </form>
            </div>

            <div class="tab-pane fade" id="tabGenap">
              <form id="formNilaiGenap" novalidate>
                <input type="hidden" id="inputAmpuGenap">
                <div class="mb-2">
                  <label class="form-label small text-muted">Nilai Tugas</label>
                  <input type="number" step="0.01" min="0" max="100" id="tugasGenap" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small text-muted">Nilai UTS</label>
                  <input type="number" step="0.01" min="0" max="100" id="utsGenap" class="form-control" required>
                </div>
                <div class="d-flex justify-content-between">
                  <div id="btnDeleteGenapContainer"></div>
                  <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Simpan Genap</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="assets/js/pages/nilai-detail.js"></script>
</body>
</html>
