<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita - Profil Jurusan RPL</title>

  <link rel="icon" type="image/jpeg" href="assets/logo/logoril3.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <div class="container mt-4 flex-grow-1">
    <div class="container">
      <div class="card p-4 shadow-sm">
        <h4 id="formHeading" class="fw-semibold mb-3">Tambah Berita</h4>
        <div id="postingAsInfo" class="mb-2 small text-muted d-none"></div>

        <form id="beritaForm" novalidate>
          <div class="mb-3">
            <label for="judulInput" class="form-label">Judul</label>
            <input type="text" id="judulInput" name="judul" class="form-control" maxlength="255" required>
          </div>

          <div class="mb-3">
            <label for="isiInput" class="form-label">Isi</label>
            <textarea id="isiInput" name="isi" rows="8" class="form-control" required></textarea>
          </div>

          <div class="mb-3">
            <label for="gambarInput" class="form-label">Gambar Utama (opsional)</label>
            <input type="file" id="gambarInput" name="gambar" accept="image/*" class="form-control">
            <small class="text-muted">Maksimal 2 MB (JPG, PNG, GIF, WEBP). Disimpan di browser (localStorage).</small>

            <div id="currentImageBox" class="mt-3 d-none">
              <p id="imagePreviewLabel" class="small text-muted mb-1">Gambar saat ini:</p>
              <img id="imagePreview" src="" alt="Gambar berita"
                   style="max-width:100%; border-radius:8px; max-height:220px; object-fit:cover;">
            </div>
          </div>

          <div class="mt-3">
            <button type="submit" id="submitBtn" class="btn btn-primary">Simpan Berita</button>
            <a href="dashboard.html" class="btn btn-danger ms-2">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="assets/js/pages/berita-form.js"></script>
</body>
</html>
