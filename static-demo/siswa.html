<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Siswa - Profil Jurusan RPL</title>

  <link rel="icon" type="image/jpeg" href="assets/logo/logoril3.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <div class="container mt-4 flex-grow-1">
    <div class="layout-golden">
      <div class="left-col">
        <div class="d-flex justify-content-between mb-3 align-items-center">
          <h4>Data Siswa</h4>
          <button id="btnToggleAddSiswa" class="btn btn-success d-none" data-bs-toggle="collapse" data-bs-target="#formAdd">
            Tambah Siswa
          </button>
        </div>

        <div id="formAdd" class="collapse mb-3 card p-3 d-none">
          <form id="formTambahSiswa" novalidate>
            <div class="row g-2">
              <div class="col-md-3">
                <input name="nisn" id="add-nisn" class="form-control" placeholder="NISN (9-10 Digit)" required
                       minlength="9" maxlength="10" inputmode="numeric">
              </div>
              <div class="col-md-3">
                <input name="nama" id="add-nama" class="form-control" placeholder="Nama" required>
              </div>
              <div class="col-md-2">
                <select name="jenis_kelamin" id="add-jk" class="form-select" required>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>
              <div class="col-md-2">
                <input type="date" name="tanggal_lahir" id="add-tgl" class="form-control">
              </div>
              <div class="col-md-2">
                <select name="id_kelas" id="add-id-kelas" class="form-select" required></select>
              </div>
            </div>
            <div class="mt-2">
              <input name="no_hp" id="add-nohp" class="form-control" placeholder="No HP" required inputmode="numeric">
            </div>
            <div class="mt-2">
              <textarea name="alamat" id="add-alamat" class="form-control" placeholder="Alamat" rows="2"></textarea>
            </div>
            <div class="mt-2">
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>

        <div class="d-flex justify-content-between mb-2 align-items-center flex-wrap gap-2">
          <div class="input-group w-50" style="min-width:220px;">
            <span class="input-group-text"><i class="fa fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Cari siswa...">
          </div>
          <div class="d-flex gap-2">
            <button type="button" id="btnExportCsv" class="btn btn-outline-primary btn-sm">Export CSV</button>
            <button type="button" id="btnExportPdfAll" class="btn btn-outline-danger btn-sm">Export PDF</button>
          </div>
        </div>

        <div id="siswaContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mb-5"></div>
      </div>

      <aside class="sidebar">
        <div class="stat-card">
          <h6>Total Siswa</h6>
          <div class="stat-value" id="stat-total-siswa">0</div>
        </div>
        <div class="stat-card">
          <h6>Jenis Kelamin</h6>
          <div id="stat-jk">Laki: 0 &bull; Perempuan: 0</div>
        </div>
        <div class="stat-card">
          <h6>Jumlah Kelas</h6>
          <div id="stat-jumlah-kelas">0</div>
        </div>
        <div class="stat-card">
          <h6>Terakhir Ditambahkan</h6>
          <div class="recent-list" id="recent-siswa-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Detail / Edit Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="padding-left: 40px;" id="detailModalLabel">
            Detail Siswa: <span id="modal-nama-view"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modal-detail-view">
            <p><strong>NISN:</strong> <span id="detail-nisn"></span></p>
            <p><strong>Jenis Kelamin:</strong> <span id="detail-jk"></span></p>
            <p><strong>Tanggal Lahir:</strong> <span id="detail-tgl"></span></p>
            <p><strong>Kelas:</strong> <span id="detail-kelas"></span></p>
            <p><strong>No HP:</strong> <span id="detail-nohp"></span></p>
            <p><strong>Alamat:</strong> <span id="detail-alamat" class="wrap-text"></span></p>
          </div>

          <div id="modal-edit-form" style="display:none;">
            <form id="editForm" novalidate>
              <input type="hidden" id="edit-id-siswa">
              <div class="row g-2">
                <div class="col-md-4 mb-2">
                  <input type="text" id="edit-nisn" class="form-control" placeholder="NISN" required
                         minlength="9" maxlength="10" inputmode="numeric">
                </div>
                <div class="col-md-4 mb-2">
                  <input type="text" id="edit-nama" class="form-control" placeholder="Nama" required>
                </div>
                <div class="col-md-4 mb-2">
                  <select id="edit-jk" class="form-select" required>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                  </select>
                </div>
                <div class="col-md-4 mb-2">
                  <input type="date" id="edit-tgl" class="form-control">
                </div>
                <div class="col-md-4 mb-2">
                  <select id="edit-id-kelas" class="form-select" required></select>
                </div>
                <div class="col-md-4 mb-2">
                  <input type="text" id="edit-nohp" class="form-control" placeholder="No HP" required inputmode="numeric">
                </div>
              </div>
              <div class="mt-2">
                <textarea id="edit-alamat" class="form-control" placeholder="Alamat" rows="2"></textarea>
              </div>
            </form>
          </div>
        </div>

        <div class="modal-footer d-flex flex-column align-items-center pt-0">
          <div id="view-buttons" class="d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            <button type="button" id="btnModalEdit" class="btn btn-primary d-none">Edit</button>
            <button type="button" id="btnModalDelete" class="btn btn-danger d-none">Hapus</button>
          </div>

          <div id="edit-buttons" style="display:none;" class="gap-2">
            <button type="button" id="btnModalSave" class="btn btn-primary">Simpan</button>
            <button type="button" id="btnModalCancelEdit" class="btn btn-secondary">Batal</button>
          </div>

          <div class="mt-2">
            <button type="button" id="btn-export-siswa-pdf" class="btn btn-sm btn-outline-danger">Export PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="assets/js/pages/siswa.js"></script>
</body>
</html>
