<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Kelas - Profil Jurusan RPL</title>

  <link rel="icon" type="image/jpeg" href="assets/logo/logoril3.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <div class="container mt-4 flex-grow-1">
    <div class="layout-golden">
      <div class="left-col">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Data Kelas</h4>
          <button id="btnToggleAddKelas" class="btn btn-success d-none" data-bs-toggle="collapse" data-bs-target="#formAddKelas">
            Tambah
          </button>
        </div>

        <div id="formAddKelas" class="collapse card p-3 mb-3 d-none">
          <form id="formTambahKelas" novalidate>
            <div class="row g-2">
              <div class="col-md-3">
                <select id="add-tingkat" name="tingkat" class="form-select" required>
                  <option value="">Pilih Tingkat</option>
                  <option value="X">X</option>
                  <option value="XI">XI</option>
                  <option value="XII">XII</option>
                </select>
              </div>
              <div class="col-md-3">
                <input type="text" id="add-kelas" name="kelas" class="form-control" placeholder="Nama Kelas" required>
              </div>
              <div class="col-md-4">
                <select id="add-wali" name="id_wali" class="form-select"></select>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Simpan</button>
              </div>
            </div>
          </form>
        </div>

        <div class="d-flex justify-content-between mb-2 align-items-center flex-wrap gap-2">
          <div class="input-group w-50" style="min-width:220px;">
            <span class="input-group-text"><i class="fa fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Cari kelas (Tingkat, Nama, Wali)...">
          </div>
          <div class="d-flex gap-2">
            <button type="button" id="btnExportCsv" class="btn btn-outline-primary btn-sm">Export CSV</button>
            <button type="button" id="btnExportPdfAll" class="btn btn-outline-danger btn-sm">Export PDF</button>
          </div>
        </div>

        <div id="kelasContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mb-5"></div>
      </div>

      <aside class="sidebar">
        <div class="stat-card">
          <h6>Total Kelas</h6>
          <div class="stat-value" id="stat-total-kelas">0</div>
        </div>
        <div class="stat-card">
          <h6>Jumlah Tingkat</h6>
          <div id="stat-tingkat-count">0</div>
        </div>
        <div class="stat-card">
          <h6>Jumlah Wali</h6>
          <div id="stat-wali-count">0</div>
        </div>
        <div class="stat-card">
          <h6>Terakhir Ditambahkan</h6>
          <div class="recent-list" id="recent-kelas-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Detail / Edit Modal -->
  <div class="modal fade" id="detailModalKelas" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" style="padding-left: 40px;" id="detailModalLabel">
            Detail Kelas: <span id="modalNama"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="modal-kelas-view">
            <p><strong>Tingkat:</strong> <span id="modalTingkat"></span></p>
            <p><strong>Nama Kelas:</strong> <span id="modalKelas"></span></p>
            <p><strong>Wali Kelas:</strong> <span id="modalWali"></span></p>
          </div>

          <div id="modal-kelas-edit" style="display:none;">
            <form id="editForm" novalidate>
              <input type="hidden" id="editId">
              <div class="row g-2">
                <div class="col-md-4 mb-2">
                  <label class="form-label small text-muted">Tingkat</label>
                  <select id="editTingkat" class="form-select" required>
                    <option value="X">X</option>
                    <option value="XI">XI</option>
                    <option value="XII">XII</option>
                  </select>
                </div>
                <div class="col-md-4 mb-2">
                  <label class="form-label small text-muted">Nama Kelas</label>
                  <input type="text" id="editKelas" class="form-control" placeholder="Nama Kelas" required>
                </div>
                <div class="col-md-4 mb-2">
                  <label class="form-label small text-muted">Wali Kelas</label>
                  <select id="editWali" class="form-select"></select>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="modal-footer d-flex flex-column align-items-center pt-0">
          <div id="viewButtons" class="d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            <button type="button" id="btnModalEdit" class="btn btn-primary d-none">Edit</button>
            <button type="button" id="btnModalDelete" class="btn btn-danger d-none">Hapus</button>
          </div>

          <div id="editButtons" style="display:none;" class="gap-2">
            <button type="button" id="btnModalSave" class="btn btn-primary">Simpan</button>
            <button type="button" id="btnModalCancelEdit" class="btn btn-secondary">Batal</button>
          </div>

          <div class="mt-2">
            <button type="button" id="btnExportPdf" class="btn btn-sm btn-outline-danger">Export PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="assets/js/pages/kelas.js"></script>
</body>
</html>
